  <path d="M36 1045H1764" stroke="#b79b62" stroke-opacity=".45"/>
  <text x="36" y="1081" class="body">Decorative depth is not excavation. Close labels are not nine cards. Commands remain usable at every scale.</text>
  <text x="36" y="1117" class="small muted">HP and combat examples are illustrative engineering fixtures, not new balance. Cards retain their hover inspection. Camera motion never changes rules.</text>
