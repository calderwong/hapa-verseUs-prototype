<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">Hapa Versus: zoom reveals the party and its territory</title>
  <desc id="desc">Three proposed interface states. At overview a Castle is selected and has a two-step route, with no detail popup. At close range a real five-member Pawn formation contains three Swordsmen in front slots one, two and three, two Archers in rear slots seven and nine, and an empty center. Upright role and health labels sit beside those members. The third panel explains a territory diorama with a rim, ground, near props and far geometry, and separately illustrates an actual excavation. This is a design schematic, not a runtime capture. Health and combat values are illustrative engineering fixtures.</desc>
